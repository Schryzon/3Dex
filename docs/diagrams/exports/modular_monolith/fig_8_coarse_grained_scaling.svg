les (Auth, Commerce, Community).</text></g><!--link Rep1 to Rep2--><g id="link_Rep1_Rep2"><path d="M590.8716,215.2879 C590.7968,214.9883 590.7214,214.6888 590.6454,214.3892 C590.4934,213.79 590.3389,213.1908 590.1818,212.5916 C589.8678,211.3933 589.5437,210.1951 589.2092,208.9979 C586.5333,199.4202 583.1937,189.9016 579.0345,180.8108 C570.7163,162.6292 559.12,146.1592 543,134.3517 C457.67,71.8417 143.47,61.2617 67,134.3517 C39.425,160.7067 36.6875,203.0567 41.195,239.7242 C42.3219,248.8911 43.9016,257.7028 45.6592,265.8207 C46.538,269.8796 47.4613,273.765 48.3947,277.4347 C48.8614,279.2695 49.3306,281.0504 49.7981,282.772 C50.0318,283.6329 50.2651,284.4789 50.4975,285.3094 C50.6136,285.7247 49.0918,280.3639 49.2074,280.7713 " fill="none" id="Rep1-to-Rep2" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="50.8451,286.5435,52.2367,276.7934,49.4804,281.7334,44.5405,278.977,50.8451,286.5435" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="157" x="250.5" y="83.3009">Autoscaler triggers full replica</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="164" x="247" y="99.2619">due to Dexie AI CPU bottleneck</text></g><!--link Mono_Scaling to GMN23--><g id="link_Mono_Scaling_GMN23"><path d="M1139.2117,316.7292 C1139.4441,316.8532 1139.6809,316.9797 1139.9223,317.1085 C1140.4049,317.3661 1140.9054,317.6332 1141.4233,317.9097 C1143.4948,319.0153 1145.8445,320.2695 1148.4444,321.657 C1158.8438,327.2073 1173.245,334.893 1189.85,343.7542 C1223.06,361.4767 1265.085,383.9017 1301.54,403.3517 " fill="none" id="Mono_Scaling-GMN23" style="stroke:#000000;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[hLLPJoD747xthwWuGZ8I9ki14zOFaNpkMWA2i8aKXGWrFJKpBNgwhJuWpch_UwfxniTQngj5cOUvwlhggwD_SWMM20l9X6hOPw4MpB0Ik2uNMg5oCxUK2BwKoPPqmFXpRhHNwL1BRU2r40wtv2bcp4itqMGl_aNe9Fk5Dun2DsUOQuJxQVC4cdqZcAGNovHjMpGYsxAq1Klrgr0vP4pQxO0H2zT6e