8;stroke-width:1.0;" width="15" x="358" y="663.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="356" y="665.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="356" y="669.7617"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="86" x="267" y="691.7109">Dexie AI Module</text></g><!--entity M6--><g id="elem_M6"><rect fill="#FFFFFF" height="45.9609" rx="3" ry="3" style="stroke:#4A5568;stroke-width:1.0;" width="147" x="413.5" y="658.7617"/><rect fill="#FFFFFF" height="10" style="stroke:#4A5568;stroke-width:1.0;" width="15" x="540.5" y="663.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="538.5" y="665.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="538.5" y="669.7617"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="107" x="428.5" y="691.7109">Notification Module</text></g><!--entity M7--><g id="elem_M7"><rect fill="#FFFFFF" height="45.9609" rx="3" ry="3" style="stroke:#4A5568;stroke-width:1.0;" width="109" x="88.5" y="835.7617"/><rect fill="#FFFFFF" height="10" style="stroke:#4A5568;stroke-width:1.0;" width="15" x="177.5" y="840.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="175.5" y="842.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="175.5" y="846.7617"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="69" x="103.5" y="868.7109">Print Module</text></g><!--entity M8--><g id="elem_M8"><rect fill="#FFFFFF" height="45.9609" rx="3" ry="3" style="stroke:#4A5568;stroke-width:1.0;" width="120" x="233" y="835.7617"/><rect fill="#FFFFFF" height="10" style="stroke:#4A5568;stroke-width:1.0;" width="15" x="333" y="840.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="331" y="842.7617"/><rect fill="#FFFFFF" height="2" style="stroke:#4A5568;stroke-width:1.0;" width="4" x="331" y="846.7617"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="80" x="248" y="868.7109">Admin Module</text></g><!--entity DB_Postgres--><g id="elem_DB_Postgres"><path d="M1004,1038.7617 C1004,1028.7617 1052,1028.7617 1052,1028.7617 C1052,1028.7617 1100,1028.7617 1100,1038.7617 L1100,1079.6836 C1100,1089.6836 1052,1089.6836 1052,1089.6836 C1052,1089.6836 1004,1089.6836 1004,1079.6836 L1004,1038.7617 " fill="#FFFFFF" style="stroke:#2B2D42;stroke-width:1.5;"/><path d="M1004,1038.7617 C1004,1048.7617 1052,1048.7617 1052,1048.7617 C1052,1048.7617 1100,1048.7617 1100,1038.7617 " fill="none" style="stroke:#2B2D42;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="76" x="1014" y="1065.7109">PostgreSQL 16</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="57" x="1014" y="1081.6719">(Port 5432)</text></g><!--entity DB_Minio--><g id="elem_DB_Minio"><path d="M752.5,506.7617 C752.5,496.7617 804,496.7617 804,496.7617 C804,496.7617 855.5,496.7617 855.5,506.7617 L855.5,547.6836 C855.5,557.6836 804,557.6836 804,557.6836 C804,557.6836 752.5,557.6836 752.5,547.6836 L752.5,506.7617 " fill="#FFFFFF" style="stroke:#2B2D42;stroke-width:1.5;"/><path d="M752.5,506.7617 C752.5,516.7617 804,516.7617 804,516.7617 C804,516.7617 855.5,516.7617 855.5,506.7617 " fill="none" style="stroke:#2B2D42;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="83" x="762.5" y="533.7109">MinIO S3 Server</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="57" x="762.5" y="549.6719">(Port 9000)</text></g><g id="elem_GMN21"><path d="M641.5,623.7617 L641.5,739.4883 A3,3 0 0 0 644.5,742.4883 L995.5,742.4883 A3,3 0 0 0 998.5,739.4883 L998.5,630.7617 L988.5,620.7617 L644.5,620.7617 A3,3 0 0 0 641.5,623.7617 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M988.5,620.7617 L988.5,629.2617 A1.5,1.5 0 0 0 990,630.7617 L998.5,630.7617 L988.5,620.7617 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="223" x="647.5" y="638.7109">CRITICAL ARCHITECTURAL DISTINCTION:</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="303" x="647.5" y="654.6719">Although 3Dex runs across 4 distinct infrastructure nodes,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="336" x="647.5" y="670.6328">the backend business modules (Auth, Catalog, Commerce, etc.)</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="250" x="647.5" y="686.5938">CANNOT be deployed or scaled independently.</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="303" x="647.5" y="702.5547">Modifying one module requires rebuilding &amp; redeploying</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="249" x="647.5" y="718.5156">the ENTIRE Backend Container (Single Artifact).</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="306" x="647.5" y="734.4766">--&gt; Infrastructure is Distributed, Application is Monolithic.</text></g><!--link C_Web to N2--><g id="link_C_Web_N2"><path d="M609,181.3117 C609,225.4567 609,310.6967 609,385.393 C609,387.7272 609,390.0512 609,392.3633 C609,392.9413 609,387.5186 609,388.0951 " fill="none" id="C_Web-to-N2" style="stroke:#000000;stroke-width:2.0;"/><polygon fill="#000000" points="609,394.0951,613,385.0951,609,389.0951,605,385.0951,609,394.0951" style="stroke:#000000;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="107" x="610" y="289.2109">REST API (Port 5000)</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="107" x="610" y="305.1719">[Network Boundary]</text></g><!--link N2 to DB_Postgres--><g id="link_N2_DB_Postgres"><path d="M617.1188,532.5694 C617.3105,532.6691 617.5053,532.7704 617.7031,532.873 C618.0988,533.0784 618.5066,533.2896 618.9263,533.5064 C619.7657,533.94 620.6525,534.3962 621.5847,534.8731 C629.0419,538.6889 639.3963,543.8373 651.5025,549.4505 C675.715,560.6767 706.935,573.7617 736,581.7617 C796.57,598.4317 972.85,575.1017 1016,620.7617 C1124.24,735.2717 1082.6539,944.3785 1062.0539,1022.8285 " fill="none" id="N2-to-DB_Postgres" style="stroke:#000000;stroke-width:2.0;"/><polygon fill="#000000" points="1060.53,1028.6317,1066.6846,1020.9427,1061.7999,1023.7957,1058.947,1018.9109,1060.53,1028.6317" style="stroke:#000000;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="69" x="1105" y="786.7109">SQL Protocol</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="107" x="1086" y="802.6719">[Network Boundary]</text></g><!--link N2 to DB_Minio--><g id="link_N2_DB_Minio"><path d="M617.0393,527.2617 C617.1423,527.2617 617.2462,527.2617 617.3511,527.2617 C617.5607,527.2617 617.7739,527.2617 617.9906,527.2617 C618.8574,527.2617 619.7801,527.2617 620.7559,527.2617 C622.7074,527.2617 624.871,527.2617 627.2228,527.2617 C636.63,527.2617 649.0487,527.2617 662.955,527.2617 C690.7675,527.2617 718.53,527.2617 746.05,527.2617 " fill="none" id="N2-to-DB_Minio" style="stroke:#000000;stroke-width:2.0;"/><polygon fill="#000000" points="752.05,527.2617,743.05,523.2617,747.05,527.2617,743.05,531.2617,752.05,527.2617" style="stroke:#000000;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="60" x="650.