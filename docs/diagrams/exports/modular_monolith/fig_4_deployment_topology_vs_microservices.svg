<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1122px" preserveAspectRatio="none" style="width:1201px;height:1122px;background:#FFFFFF;" version="1.1" viewBox="0 0 1201 1122" width="1201px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="778" x="207" y="38.7402">Figure 4: Physical Infrastructure Topology vs. Logical Application Boundary</text><!--cluster N1--><g id="cluster_N1"><polygon fill="#F8F9FA" points="485,71.2617,495,61.2617,733,61.2617,733,187.2617,723,197.2617,485,197.2617,485,71.2617" style="stroke:#4A5568;stroke-width:1.5;"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="723" x2="733" y1="71.2617" y2="61.2617"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="485" x2="723" y1="71.2617" y2="71.2617"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="723" x2="723" y1="71.2617" y2="197.2617"/><text fill="#000000" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="172" x="519" y="88.29">Node 1: Frontend Container</text><text fill="#000000" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="162" x="524" y="105.5811">(Independently Deployed)</text></g><!--cluster N2--><g id="cluster_N2"><polygon fill="#F8F9FA" points="21,404.2617,31,394.2617,617,394.2617,617,919.7617,607,929.7617,21,929.7617,21,404.2617" style="stroke:#4A5568;stroke-width:1.5;"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="607" x2="617" y1="404.2617" y2="394.2617"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="21" x2="607" y1="404.2617" y2="404.2617"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="607" x2="607" y1="404.2617" y2="929.7617"/><text fill="#000000" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238" x="196" y="421.29">Node 2: Backend Monolithic Container</text><text fill="#000000" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152" x="239" y="438.5811">(Single Deployable Unit)</text></g><!--cluster Monolith_Unit--><g id="cluster_Monolith_Unit"><path d="M56,468.2617 L408,468.2617 A4.5,4.5 0 0 1 411,471.2617 L418,491.5527 L574,491.5527 A3,3 0 0 1 577,494.5527 L577,894.7617 A3,3 0 0 1 574,897.7617 L56,897.7617 A3,3 0 0 1 53,894.7617 L53,471.2617 A3,3 0 0 1 56,468.2617 " fill="#F8F9FA" style="stroke:#4A5568;stroke-width:1.2;"/><line style="stroke:#4A5568;stroke-width:1.2;" x1="53" x2="418" y1="491.5527" y2="491.5527"/><text fill="#000000" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="352" x="57" y="484.29">Modular Monolith Codebase (deploy.tar / Docker Image)</text></g><!--cluster N3--><g id="cluster_N3"><polygon fill="#F8F9FA" points="928,980.7617,938,970.7617,1177,970.7617,1177,1095.7617,1167,1105.7617,928,1105.7617,928,980.7617" style="stroke:#4A5568;stroke-width:1.5;"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="1167" x2="1177" y1="980.7617" y2="970.7617"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="928" x2="1167" y1="980.7617" y2="980.7617"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="1167" x2="1167" y1="980.7617" y2="1105.7617"/><text fill="#000000" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="173" x="962" y="997.79">Node 3: Relational DB Node</text><text fill="#000000" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129" x="984" y="1015.0811">(State Infrastructure)</text></g><!--cluster N4--><g id="cluster_N4"><polygon fill="#F8F9FA" points="693,448.7617,703,438.7617,949,438.7617,949,563.7617,939,573.7617,693,573.7617,693,448.7617" style="stroke:#4A5568;stroke-width:1.5;"/><line style="stroke:#4A5568;stroke-width:1.5;" x1="939" x2="949" y1="448.7617" y2="438.7617"/><line st